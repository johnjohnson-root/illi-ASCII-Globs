<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Globs — render any .glb as ASCII</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  canvas { display: block; }
  canvas.grab    { cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  .panel {
    background: rgba(10, 10, 10, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 6px 10px;

  }
  #controls {
    position: fixed; right: 12px; top: 12px; z-index: 2; width: 232px;
    font: 12px/1.7 ui-monospace, monospace; color: #999;
    display: flex; flex-direction: column; gap: 6px;
  }
  #controls label { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  #controls input[type=range] { flex: 1; min-width: 0; accent-color: #ff8033; }
  #controls input[type=text], #controls select, #controls button {
    font: inherit; color: #ccc; background: rgba(255,255,255,0.06);

  }
  #controls button { cursor: pointer; }
  #controls button:hover { background: rgba(255,255,255,0.12); }
  #controls hr { border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 2px 0; width: 100%; }
  #controls .row { display: flex; gap: 6px; }
  #controls .row > * { flex: 1; min-width: 0; }
  #status { color: #ff8033; min-height: 1.7em; overflow-wrap: anywhere; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 1;

    pointer-events: none; user-select: none;
  }
</style>

<div id="hud" class="panel"></div>

<div id="controls" class="panel">
  <div class="row">
    <button id="pick">upload .glb</button>
    <button id="copy">copy config</button>
  </div>
  <input type="text" id="url" placeholder="…or paste a .glb / .gltf URL" spellcheck="false">
  <input type="file" id="file" accept=".glb,.gltf" hidden>
  <div id="status"></div>
  <hr>
  <label>spin <input type="checkbox" id="spin"></label>
  <label>scroll
    <select id="effect">
      <option value="clip">animation</option>
      <option value="orbit">orbit</option>
      <option value="dolly">dolly</option>
      <option value="smear">smear</option>
      <option value="exit">dissolve</option>
      <option value="none">nothing</option>
    </select>
  </label>
  <hr>
  <label>cell <input type="range" id="gran"  min="2"   max="24"  step="1"></label>
  <label>ramp <input type="range" id="limit" min="2"   max="16"  step="1"></label>
  <label>size <input type="range" id="fit"   min="0.4" max="3.5" step="0.05"></label>
  <label>tone <input type="range" id="remap" min="0.2" max="1.5" step="0.05"></label>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// Everything adjustable lives here.
const CONFIG = {
  characters: ' * _<>,  ./O#SF +',  // glyph ramp, darkest -> densest
  charLimit:  15,                   // how many of them the luminance ramp maps onto (site: 16)
  granularity: 10,                  // cell size in CSS px
  fontSize:   72,                   // px, drawn into a 64px atlas cell
  color:      '#eeeeee',            // glyph colour
  accentColor:'#ff8033',            // trail highlight (site theme-orange: 1.0, 0.5, 0.2)
  background: '#0a0a0a',
  brightnessFloor: 0.005,           // on-model cells never render darker than this (linear)

  // One entry per surface. `match` is tested against the mesh's own name and every
  // ancestor's, so naming a group in Blender shades its whole subtree.
  // First match wins; `default` catches the rest.
  surfaces: {
    branch: {
      match:          /^branch/i,
      remapColor:     [0.69, 0.90, 0.90],
      lightDir:       [0.0, 2.0, 1.0],
      brightness:     0.2,
      normalStrength: 0.5,
    },
    default: {
      remapColor:     [0.85, 0.85, 0.85],
      lightDir:       [0.0, 0.8, 1.0],
      brightness:     0.5,
      normalStrength: 1.05,   // lower reads smoother on low-poly models
    },
  },

  noise: false,
  matrix: false,        // per-column vertical scroll
  matrixSpeed: 0.15,    // screens per second at max column noise
  smear: 0.0,           // 0..1 — how far up the waterfall collapse reaches
  outProgress: 0.0,     // 0..1 — columns lift off the top
  reveal: 1.0,          // threshold: 0 = fully visible, 1 = fully hidden

  revealDuration: 1.4,  // seconds
  exitDuration:   0.9,

  // The entrance runs the dissolve backwards as the wipe uncovers the surface.
  // The lift settles first, so the last beat is the wipe rather than sliding geometry.
  revealLift:         0.6,
  revealLiftDuration: 1.0,

  // Any .glb or .gltf. Draco files work as-is — the decoder is vendored in libs/draco/.
  // Materials and textures in the file are discarded; the surface shader replaces them.
  model:     'models/Fox.glb',
  dracoPath: 'libs/draco/',
  // A long lens flattens perspective but shrinks the frustum,
  // so fitRadius has to come down with fov.
  fov: 35,

  // The model is scaled so its bounding sphere matches this.
  // How much of that sphere it actually fills varies wildly by shape.
  fitRadius: 1.85,

  cameraDistance:  5,
  cameraElevation: 0,       // degrees above the horizon

  // The subject turns under a still camera, as it did originally.
  spin:     true,           // toggle in the panel
  idleSpin: 0.3,            // radians per second about +Y
  idleBob:  0.15,           // world units, peak of the vertical drift

  // With spin off, drag to turn the model by hand.
  dragSensitivity: 0.008,   // radians per pixel
  dragPitchLimit:  80,      // degrees, to stop it tipping past vertical

  // What the wheel drives. 'clip' scrubs the model's own animation and does
  // nothing on a model without one; the rest work on anything.
  //   clip   scrub the glTF animation      orbit  circle the camera
  //   dolly  pull the camera back          smear  melt rows downward
  //   exit   lift columns off the top      none   ignore the wheel
  scrollEffect: 'clip',
  orbitTurns:   1,          // full revolutions across a complete scroll
  dollyRange:   2.5,        // camera distance multiplier at 100%

  subjectYaw: 0,            // degrees, negative is clockwise from above

  // An optional keyframed path. The camera always aims at the model,
  // and `pitchBias` tilts down from that aim — 0 centres it.
  useCameraPath: false,
  cameraPath: [
    { at: 0.00, pos: [ 0.00, 0.70, 0.20], pitchBias: 0 },
    { at: 0.15, pos: [ 0.00, 1.10, 0.40], pitchBias: 0 },
    { at: 0.35, pos: [-0.15, 1.70, 0.80], pitchBias: 0 },
    { at: 0.70, pos: [ 0.30, 2.80, 1.10], pitchBias: 0 },
  ],

  // Past the last keyframe the camera holds that height and radius
  // and orbits counterclockwise instead of travelling.
  orbitSweep:        90,
  orbitEndPitchBias: 0,

  // Some models ship their own animated camera rig. Turn this on to use it.
  useModelCamera:   false,
  cameraFollowNode: 'camera-follow',
  cameraLookAtNode: 'camera-lookAt',

  // The clip is scrubbed by the wheel rather than running on a clock. Damping
  // eases the value toward wherever scrolling has left it.
  scrollSensitivity: 0.0006,   // progress per wheel pixel
  scrollDamping:     0.12,
};

const TRAIL_LENGTH = 40;

// Glyph atlas, drawn at runtime rather than shipped as an image:
// a 1024px canvas, 16x16 grid, one character per cell.
function makeAtlas({ characters, fontSize }) {
  const SIZE = 1024, GRID = 16, CELL = SIZE / GRID;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;

  const ctx = canvas.getContext('2d');
  ctx.font = `${fontSize}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'white';

  characters.split('').forEach((char, i) => {
    const col = i % GRID, row = Math.floor(i / GRID);
    ctx.fillText(char, col * CELL + CELL / 2, row * CELL + CELL / 2);
  });

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = texture.magFilter = THREE.NearestFilter;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;   // charUV goes negative
  return texture;
}

// Scene pass: shaded from normals alone, no lights or textures, into an offscreen target.
// The skinning chunks matter — without them a rigged model renders in bind pose
// and its animation is silently ignored.
const sceneVert = /* glsl */`
  #include <common>
  #include <skinning_pars_vertex>

  varying vec3 vNormal;

  void main() {
    #include <beginnormal_vertex>
    #include <skinbase_vertex>
    #include <skinnormal_vertex>
    #include <defaultnormal_vertex>

    vNormal = normalize(transformedNormal);

    #include <begin_vertex>
    #include <skinning_vertex>
    #include <project_vertex>
  }
`;

const sceneFrag = /* glsl */`
  uniform vec3  uRemapColor;
  uniform vec3  uLightDir;
  uniform float uBrightness;
  uniform float uNormalStrength;
  uniform float uReveal;
  varying vec3  vNormal;

  void main() {
    // Thin surfaces are single-sided, so their undersides are backfaces.
    // We draw those, and flip the normal so they don't shade as if lit from behind.
    vec3 normal = normalize(vNormal);
    if (!gl_FrontFacing) normal = -normal;

    float diff  = max(dot(normal, normalize(uLightDir)), 0.0);

    vec3 color = (diff * uBrightness) + normal * uNormalStrength + 0.5;
    color = clamp(color, 0.15, 0.995);
    color *= uRemapColor;

    // Reveal wipe: upward-facing surfaces appear first, with a band on the front.
    float edge       = 0.05;
    float revealMask = dot(normal, vec3(0.0, 1.0, 0.0)) * 0.5 + 0.5;

    float visible  = step(uReveal, revealMask);
    float edgeBand = smoothstep(uReveal - edge, uReveal, revealMask)
                   - smoothstep(uReveal, uReveal + edge, revealMask);

    // Without this the band latches onto down-facing normals once the wipe is done.
    edgeBand *= smoothstep(0.0, edge, uReveal);

    // Discarding stops hidden fragments writing depth through geometry behind them.
    if (visible < 0.5) discard;

    // rgb survives only as luminance, so the band rides out in alpha for the ASCII
    // pass to tint: 0 nothing drawn, 0.5 plain surface, 1.0 full band.
    color = mix(color, vec3(0.5, 0.8, 0.2), edgeBand);

    gl_FragColor = vec4(color, 0.5 + 0.5 * clamp(edgeBand, 0.0, 1.0));
  }
`;

// Mouse trail, at quarter resolution. Not a ping-pong buffer — it redraws
// 40 circles a frame from a chain of points that ease toward each other.
const quadVert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const trailFrag = /* glsl */`
  #define TRAIL_LENGTH ${TRAIL_LENGTH}
  #define PIXEL_SIZE 80.0

  uniform vec2  uTrail[TRAIL_LENGTH];
  uniform float uTrailStrength[TRAIL_LENGTH];
  uniform float uVelocity;

  varying vec2 vUv;

  vec2 pixelate(vec2 uv, float pixels) {
    return floor(uv * pixels) / pixels;
  }

  float circle(vec2 uv, vec2 center, float radius) {
    return 1.0 - smoothstep(radius - 0.02, radius + 0.02, length(uv - center));
  }

  void main() {
    vec2 uv = pixelate(vUv, PIXEL_SIZE);
    float trail = 0.0;

    for (int i = 0; i < TRAIL_LENGTH; i++) {
      float fade     = 1.0 - float(i) / float(TRAIL_LENGTH);
      float size     = uVelocity * 0.025 * fade;
      float strength = uTrailStrength[i] * fade;
      trail += circle(uv, uTrail[i], size) * strength;
    }

    trail = clamp(trail, 0.0, 1.0);
    gl_FragColor = vec4(vec3(trail), trail * uVelocity);
  }
`;

// ASCII pass: pixelate to a grid, read each cell's luminance, pick a glyph.
const asciiFrag = /* glsl */`
  precision highp float;

  uniform sampler2D tDiffuse;
  uniform sampler2D tMouseTrail;
  uniform sampler2D uCharactersTexture;
  uniform vec2  uResolution;
  uniform float uGranularity;
  uniform float uCharactersLimit;
  uniform vec3  uColor;
  uniform vec3  uAccentColor;
  uniform vec3  uBackground;
  uniform float uBrightnessFloor;
  uniform float uTime;
  uniform float uSmear;
  uniform float uMatrixSpeed;
  uniform float uOutProgress;
  uniform bool  uNoise;
  uniform bool  uMatrix;

  varying vec2 vUv;

  const float GRID = 16.0;  // atlas is 16x16 cells

  // Averaging the cell beats point-sampling its centre, which pops a whole glyph
  // the instant one texel crosses a ramp boundary.
  // The /3.0 spread is measured — /4.0 sits too near the centre to help,
  // and /2.0 puts the outer taps on the boundary where neighbours share them.
  vec4 cellAverage(vec2 uv, vec2 cell) {
    vec4 sum = vec4(0.0);
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        sum += texture2D(tDiffuse, uv + vec2(float(i), float(j)) * cell / 3.0);
      }
    }
    return sum / 9.0;
  }

  float glyph(float index, vec2 screenUV, vec2 division) {
    float charX = mod(index, GRID);
    float charY = floor(index / GRID);

    vec2 charUV = mod(screenUV * (division / GRID), 1.0 / GRID);
    charUV.y -= 1.0 / GRID;                     // canvas rows run top-down, UV bottom-up
    charUV   += vec2(charX, -charY) / GRID;

    return texture2D(uCharactersTexture, charUV).r;
  }

  float grayscale(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
  float noise2D(vec2 p)   { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  float random(float x)   { return fract(sin(x) * 123456.789); }
  float hash(float n)     { return fract(sin(n) * 43758.5453); }

  void main() {
    vec2 screenUV = vUv;

    // --- pixelation grid ---
    vec2 division    = uResolution / uGranularity;
    vec2 d           = 1.0 / division;
    vec2 pixelizedUV = d * (floor(screenUV / d) + 0.5);

    vec4 mouseTrail = texture2D(tMouseTrail, screenUV);

    // Each column scrolls at its own rate. The atlas is sampled at screenUV,
    // so the cells stay put and only their content streams.
    if (uMatrix) {
      float noise = random(pixelizedUV.x);
      pixelizedUV.y += uTime * uMatrixSpeed * abs(noise);
      pixelizedUV.y  = fract(pixelizedUV.y);
    }

    // Computed before smear touches .x, applied after.
    // Each column leaves at its own rate so the frame empties raggedly.
    float columnNoise = random(floor(pixelizedUV.x * division.x));
    float exitLift    = uOutProgress * (1.2 + columnNoise);

    // Rows below the front collapse onto the bottom row and fade out.
    float waterfallAlpha = 1.0;

    if (uSmear > 0.0) {
      float rowHeight = d.y;
      float py        = clamp(pixelizedUV.y, 0.0, 1.0);

      float rowIndex  = floor(py / rowHeight);
      float totalRows = division.y;

      float rowNoise     = hash(rowIndex * 17.0);
      float edgeNoise    = hash(rowIndex * 21.0);
      float stretchNoise = hash(rowIndex * 9.0 + 0.3);

      float smearRows      = uSmear * totalRows;
      float noiseAmount    = 0.35 * uSmear;
      float noisySmearRows = smearRows + (rowNoise - 0.5) * noiseAmount * totalRows;

      float blendRows = max(1.0, smearRows * 0.835);
      float dist      = noisySmearRows - rowIndex;
      float smearMask = clamp(dist / blendRows, 0.0, 1.0);
      smearMask = pow(smearMask, mix(1.5, 3.0, edgeNoise));

      float lastRowY   = rowHeight * 0.5;
      float flowNoise  = hash(rowIndex * 31.0 + pixelizedUV.x * 13.0);
      py -= flowNoise * rowHeight * smearMask * 0.6;
      py  = mix(py, lastRowY, smearMask);

      float depth   = 1.0 - (rowIndex / totalRows);
      float stretch = 0.1 * uSmear;
      stretch *= stretch;
      stretch *= mix(0.6, 1.4, stretchNoise);

      pixelizedUV.x = 0.5 + (pixelizedUV.x - 0.5) * (1.0 + stretch * smearMask);
      pixelizedUV.y = py;

      waterfallAlpha = mix(1.0, 0.05, depth * smearMask * uSmear);
    }

    // --- apply exit ---
    pixelizedUV.y -= exitLift;

    if (pixelizedUV.y < 0.0) {
      gl_FragColor = vec4(uBackground, 1.0);
      return;
    }

    vec4 pixelizedColor = cellAverage(pixelizedUV, d);

    // Alpha carries two things: above 0.25 is surface,
    // and whatever sits above 0.5 is the wipe's edge band.
    float visible = step(0.25, pixelizedColor.a);
    float band    = clamp((pixelizedColor.a - 0.5) * 2.0, 0.0, 1.0) * visible;
    float gray    = grayscale(pixelizedColor.rgb) * visible;

    // --- edge detection, used to gate the trail ---
    vec2 texel = 1.0 / uResolution;
    float left  = grayscale(cellAverage(pixelizedUV + vec2(-texel.x, 0.0), d).rgb);
    float right = grayscale(cellAverage(pixelizedUV + vec2( texel.x, 0.0), d).rgb);
    float up    = grayscale(cellAverage(pixelizedUV + vec2(0.0,  texel.y), d).rgb);
    float down  = grayscale(cellAverage(pixelizedUV + vec2(0.0, -texel.y), d).rgb);
    float edgeMask = smoothstep(0.01, 0.25, length(vec2(right - left, up - down)));

    // The trail overrides the glyph index, but only on edges,
    // otherwise it punches flat holes through the middle of the shape.
    float baseF  = gray * (uCharactersLimit - 1.0);
    float trailF = mouseTrail.r * (uCharactersLimit - 1.0);
    float trailInfluence = step(0.1, mouseTrail.r) * edgeMask;
    float f = mix(baseF, trailF, trailInfluence);

    // Cross-fade the pair the ramp falls between, so a cell dissolves from one
    // character into the next. i1 is clamped off the blank slot past the ramp's end.
    float i0 = floor(f);
    float i1 = min(i0 + 1.0, uCharactersLimit - 1.0);

    float ascii = mix(glyph(i0, screenUV, division), glyph(i1, screenUV, division), fract(f));

    if (uNoise) {
      float n = noise2D(pixelizedUV * 120.0 + uTime * 0.033);
      ascii *= mix(0.6, 1.4, smoothstep(0.5, 0.9, n));
    }

    ascii *= waterfallAlpha;

    vec3 color = mix(uBackground, uColor * ascii, clamp(ascii, 0.0, 1.0));

    // --- accent: trailed edges, plus the reveal wipe front ---
    float accent = clamp(max(mouseTrail.r * edgeMask, band), 0.0, 1.0) * ascii;
    color = mix(color, uAccentColor, accent);

    // Keep the darkest cells off pure black, only where the model is,
    // so the surrounding void stays exactly uBackground.
    color = max(color, vec3(uBrightnessFloor) * visible);

    gl_FragColor = vec4(color, 1.0);
  }
`;

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);   // empty pixels stay alpha 0
document.body.appendChild(renderer.domElement);

const target      = new THREE.WebGLRenderTarget(1, 1);
const trailTarget = new THREE.WebGLRenderTarget(1, 1);

const fullscreenQuad = (material) => {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
  return s;
};
const quadCamera = new THREE.Camera();

// -- pass 1: scene
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.fov, 1, 0.1, 100);
{
  const elev = THREE.MathUtils.degToRad(CONFIG.cameraElevation);
  camera.position.set(0,
                      Math.sin(elev) * CONFIG.cameraDistance,
                      Math.cos(elev) * CONFIG.cameraDistance);
  camera.lookAt(0, 0, 0);
}

// One material per surface. uReveal is a single shared uniform object,
// so the wipe stays in lockstep off one tween instead of being broadcast.
const revealUniform = { value: CONFIG.reveal };

const materials = Object.fromEntries(
  Object.entries(CONFIG.surfaces).map(([name, spec]) => [name, new THREE.ShaderMaterial({
    vertexShader: sceneVert,
    fragmentShader: sceneFrag,
    uniforms: {
      uRemapColor:     { value: new THREE.Vector3(...spec.remapColor) },
      uLightDir:       { value: new THREE.Vector3(...spec.lightDir) },
      uBrightness:     { value: spec.brightness },
      uNormalStrength: { value: spec.normalStrength },
      uReveal:         revealUniform,
    },
    side: THREE.DoubleSide,   // thin geometry has no back; culling loses the undersides
  })])
);

// Walk up the ancestry so a match on a group covers every mesh beneath it.
// glTF meshes usually carry exporter-generated names; their parents don't.
function surfaceFor(object) {
  for (const [name, spec] of Object.entries(CONFIG.surfaces)) {
    if (!spec.match) continue;
    for (let node = object; node; node = node.parent) {
      if (spec.match.test(node.name)) return materials[name];
    }
  }
  return materials.default;
}

const subject = new THREE.Group();
subject.rotation.y = THREE.MathUtils.degToRad(CONFIG.subjectYaw);
scene.add(subject);
let mixer = null, clipDuration = 0, cameraRig = null;
const _rigTarget = new THREE.Vector3();

// Centre and scale to a predictable size, so any model frames the same way
// regardless of the units it was authored in.
function fitToView(object) {
  const box    = new THREE.Box3().setFromObject(object);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  if (!sphere.radius) return;
  const scale = CONFIG.fitRadius / sphere.radius;
  object.scale.multiplyScalar(scale);
  object.position.sub(sphere.center.multiplyScalar(scale));
}

async function loadModel(url) {
  const [{ GLTFLoader }, { DRACOLoader }, { mergeVertices }] = await Promise.all([
    import('three/addons/loaders/GLTFLoader.js'),
    import('three/addons/loaders/DRACOLoader.js'),
    import('three/addons/utils/BufferGeometryUtils.js'),
  ]);

  const draco = new DRACOLoader().setDecoderPath(CONFIG.dracoPath);
  const loader = new GLTFLoader().setDRACOLoader(draco);

  try {
    const gltf = await loader.loadAsync(url);

    gltf.scene.traverse((o) => {
      if (!o.isMesh) return;
      // Drop whatever material the file shipped with.
      o.material = surfaceFor(o);
      // Plenty of glTF files ship without normals, and this shades from nothing else.
      // Bind-pose normals are correct; the vertex shader skins them afterwards.
      if (!o.geometry.attributes.normal) {
        // On non-indexed geometry computeVertexNormals gives every triangle its own
        // normal, which reads as faceted. Welding first averages across shared faces.
        // UV seams would block the weld, and nothing here reads UVs.
        if (!o.geometry.index) {
          if (o.geometry.attributes.uv) o.geometry.deleteAttribute('uv');
          o.geometry = mergeVertices(o.geometry);
        }
        o.geometry.computeVertexNormals();
      }
    });

    const holder = new THREE.Group();
    holder.add(gltf.scene);
    fitToView(holder);
    subject.add(holder);

    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      mixer.clipAction(gltf.animations[0]).play();
      clipDuration = gltf.animations[0].duration;
    }

    if (CONFIG.useModelCamera) {
      const follow = gltf.scene.getObjectByName(CONFIG.cameraFollowNode);
      const lookAt = gltf.scene.getObjectByName(CONFIG.cameraLookAtNode);
      if (follow && lookAt) cameraRig = { follow, lookAt };
    }
    return gltf;
  } finally {
    draco.dispose();
  }
}

// Swap the subject for another model, resetting everything the previous one owned.
// Falls back to the placeholder so a bad URL leaves something on screen.
let currentModel = CONFIG.model;
async function setModel(url, label) {
  const shown = label ?? url;
  setStatus('loading ' + shown + ' …');
  subject.clear();
  mixer = null; clipDuration = 0; cameraRig = null;
  try {
    const gltf = await loadModel(url);
    currentModel = shown;
    const clips = gltf.animations.length;
    setStatus('loaded ' + shown + (clips ? '  (' + clips + ' clip' + (clips > 1 ? 's' : '') + ')'
                                         : '  (no animation)'));
  } catch (err) {
    console.error(err);
    addPlaceholder();
    setStatus('failed: ' + String(err.message || err).slice(0, 70));
  }
  playReveal();
}

function addPlaceholder() {
  subject.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.36, 220, 32), materials.default));
}

if (CONFIG.model) {
  try {
    await loadModel(CONFIG.model);
  } catch (err) {
    console.error(`could not load ${CONFIG.model}, falling back to the placeholder:`, err);
    addPlaceholder();
  }
} else {
  addPlaceholder();
}

// -- pass 2: trail
const trailPoints   = Array.from({ length: TRAIL_LENGTH }, () => new THREE.Vector2(0.5, 0.5));
const trailStrength = new Array(TRAIL_LENGTH).fill(0);

const trailMaterial = new THREE.ShaderMaterial({
  vertexShader: quadVert,
  fragmentShader: trailFrag,
  blending: THREE.NoBlending,
  uniforms: {
    uTrail:         { value: trailPoints },
    uTrailStrength: { value: trailStrength },
    uVelocity:      { value: 0 },
  },
});
const trailScene = fullscreenQuad(trailMaterial);

const mouseUV = new THREE.Vector2(0.5, 0.5);
let lastMouseUV = new THREE.Vector2(0.5, 0.5);
let velocity = 0;

let dragging = false, dragLastX = 0, dragLastY = 0, dragYaw = 0, dragPitch = 0;
const canvas = renderer.domElement;

const setGrabCursor = () => {
  canvas.classList.toggle('grab', !CONFIG.spin && !dragging);
  canvas.classList.toggle('grabbing', !CONFIG.spin && dragging);
};

canvas.addEventListener('pointerdown', (e) => {
  if (CONFIG.spin) return;
  dragging = true;
  dragLastX = e.clientX; dragLastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  setGrabCursor();
});

canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  canvas.releasePointerCapture?.(e.pointerId);
  setGrabCursor();
});

addEventListener('pointermove', (e) => {
  if (dragging) {
    const limit = THREE.MathUtils.degToRad(CONFIG.dragPitchLimit);
    dragYaw   += (e.clientX - dragLastX) * CONFIG.dragSensitivity;
    dragPitch += (e.clientY - dragLastY) * CONFIG.dragSensitivity;
    dragPitch = Math.max(-limit, Math.min(limit, dragPitch));
    dragLastX = e.clientX; dragLastY = e.clientY;
  }
  mouseUV.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
  velocity = Math.min(1, velocity + mouseUV.distanceTo(lastMouseUV) * 12);
  lastMouseUV.copy(mouseUV);
});

function updateTrail() {
  velocity *= 0.94;
  // chain: every point eases toward the one in front of it
  for (let i = TRAIL_LENGTH - 1; i > 0; i--) {
    trailPoints[i].lerp(trailPoints[i - 1], 0.499);
    trailStrength[i] = THREE.MathUtils.lerp(trailStrength[i], trailStrength[i - 1] * 0.99, 0.499);
  }
  trailPoints[0].copy(mouseUV);
  trailStrength[0] = Math.min(velocity * TRAIL_LENGTH, 1);
  trailMaterial.uniforms.uVelocity.value = velocity;
}

// -- pass 3: ascii
const asciiMaterial = new THREE.ShaderMaterial({
  vertexShader: quadVert,
  fragmentShader: asciiFrag,
  uniforms: {
    tDiffuse:           { value: target.texture },
    tMouseTrail:        { value: trailTarget.texture },
    uCharactersTexture: { value: makeAtlas(CONFIG) },
    uResolution:        { value: new THREE.Vector2() },
    uGranularity:       { value: CONFIG.granularity },
    uCharactersLimit:   { value: CONFIG.charLimit },
    uColor:             { value: new THREE.Color(CONFIG.color) },
    uAccentColor:       { value: new THREE.Color(CONFIG.accentColor) },
    uBackground:        { value: new THREE.Color(CONFIG.background) },
    uBrightnessFloor:   { value: CONFIG.brightnessFloor },
    uTime:              { value: 0 },
    uSmear:             { value: CONFIG.smear },
    uMatrixSpeed:       { value: CONFIG.matrixSpeed },
    uOutProgress:       { value: CONFIG.outProgress },
    uNoise:             { value: CONFIG.noise },
    uMatrix:            { value: CONFIG.matrix },
  },
});
const asciiScene = fullscreenQuad(asciiMaterial);

function resize() {
  const w = innerWidth, h = innerHeight, dpr = renderer.getPixelRatio();
  renderer.setSize(w, h);
  target.setSize(Math.round(w * dpr), Math.round(h * dpr));
  trailTarget.setSize(Math.ceil(w * dpr / 4), Math.ceil(h * dpr / 4));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  asciiMaterial.uniforms.uResolution.value.set(w, h);
}
addEventListener('resize', resize);
resize();

// -- transitions
const tweens = [];
function tween(uniform, to, duration) {
  const running = tweens.findIndex((w) => w.uniform === uniform);
  if (running >= 0) tweens.splice(running, 1);
  tweens.push({ uniform, from: uniform.value, to, duration, elapsed: 0 });
}
function updateTweens(dt) {
  if (!tweens.length) return;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i];
    w.elapsed += dt;
    const k = Math.min(1, w.elapsed / w.duration);
    const ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    w.uniform.value = w.from + (w.to - w.from) * ease;
    if (k >= 1) tweens.splice(i, 1);
  }
  drawHud();
}

// -- scroll drives the clip
let scrollTarget = 0, scrollValue = 0;
addEventListener('wheel', (e) => {
  scrollTarget = Math.min(1, Math.max(0, scrollTarget + e.deltaY * CONFIG.scrollSensitivity));
  drawHud();
}, { passive: true });

// -- controls
const hud = document.getElementById('hud');
const drawHud = () => {
  const u = asciiMaterial.uniforms;
  hud.textContent =
    `[m] matrix ${u.uMatrix.value ? 'on ' : 'off'}   [n] grain ${u.uNoise.value ? 'on ' : 'off'}   `
    + `[ / ] smear ${u.uSmear.value.toFixed(2)}\n`
    + `[r] reveal ${revealUniform.value.toFixed(2)}   [e] exit ${u.uOutProgress.value.toFixed(2)}   `
    + `scroll ${(scrollValue * 100).toFixed(0)}%   `
    + (CONFIG.spin ? 'move the mouse for the trail' : 'drag to rotate');
};
// The entrance: the scene pass uncovers the surface while the ASCII pass
// drops the columns back down. Two passes, one gesture.
function playReveal() {
  revealUniform.value = 1;
  tween(revealUniform, 0, CONFIG.revealDuration);

  if (CONFIG.revealLift > 0) {
    const lift = asciiMaterial.uniforms.uOutProgress;
    lift.value = CONFIG.revealLift;
    tween(lift, 0, CONFIG.revealLiftDuration);
  }
}

// ---------------------------------------------------------------------------
// Panel
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const setStatus = (msg) => { $('status').textContent = msg; };

$('pick').onclick = () => $('file').click();
$('file').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  // An object URL loads without a server, but sibling .bin/texture files
  // can't be resolved from one, so this is .glb only in practice.
  setModel(URL.createObjectURL(f), f.name);
};
$('url').onkeydown = (e) => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  setModel(e.target.value.trim());
};

$('spin').checked = CONFIG.spin;
$('spin').onchange = (e) => { CONFIG.spin = e.target.checked; setGrabCursor(); drawHud(); };

$('effect').value = CONFIG.scrollEffect;
$('effect').onchange = (e) => {
  resetScrollEffects();
  CONFIG.scrollEffect = e.target.value;
  scrollTarget = scrollValue = 0;
  drawHud();
};

const bindSlider = (id, get, set) => {
  const el = $(id);
  el.value = get();
  el.oninput = () => set(parseFloat(el.value));
};
bindSlider('gran',  () => asciiMaterial.uniforms.uGranularity.value,
                    (v) => { asciiMaterial.uniforms.uGranularity.value = v; });
bindSlider('limit', () => asciiMaterial.uniforms.uCharactersLimit.value,
                    (v) => { asciiMaterial.uniforms.uCharactersLimit.value = v; });
bindSlider('fit',   () => CONFIG.fitRadius,
                    (v) => { CONFIG.fitRadius = v; refit(); });
bindSlider('remap', () => CONFIG.surfaces.default.remapColor[0],
                    (v) => { materials.default.uniforms.uRemapColor.value.setScalar(v);
                             CONFIG.surfaces.default.remapColor = [v, v, v]; });

// fitToView runs once at load, so resizing re-runs it.
// The previous fit has to be undone first or each call compounds on the last.
function refit() {
  const holder = subject.children[0];
  if (!holder) return;
  holder.scale.setScalar(1);
  holder.position.set(0, 0, 0);
  fitToView(holder);
}

// Emit the current settings as a CONFIG block.
$('copy').onclick = async () => {
  const u = asciiMaterial.uniforms;
  const n = (v, d = 2) => Number(v).toFixed(d).replace(/\.?0+$/, '');
  const code = [
    '// Generated by ASCII Globs. Paste over the matching keys in CONFIG.',
    'model:        ' + JSON.stringify(currentModel) + ',',
    'characters:   ' + JSON.stringify(CONFIG.characters) + ',',
    'charLimit:    ' + n(u.uCharactersLimit.value, 0) + ',',
    'granularity:  ' + n(u.uGranularity.value, 0) + ',',
    'color:        ' + JSON.stringify(CONFIG.color) + ',',
    'accentColor:  ' + JSON.stringify(CONFIG.accentColor) + ',',
    'background:   ' + JSON.stringify(CONFIG.background) + ',',
    'fov:          ' + n(CONFIG.fov, 0) + ',',
    'fitRadius:    ' + n(CONFIG.fitRadius) + ',',
    'spin:         ' + CONFIG.spin + ',',
    'idleSpin:     ' + n(CONFIG.idleSpin) + ',',
    'scrollEffect: ' + JSON.stringify(CONFIG.scrollEffect) + ',',
    'surfaces: { default: {',
    '  remapColor:     [' + CONFIG.surfaces.default.remapColor.map((v) => n(v)).join(', ') + '],',
    '  lightDir:       [' + CONFIG.surfaces.default.lightDir.join(', ') + '],',
    '  brightness:     ' + n(CONFIG.surfaces.default.brightness) + ',',
    '  normalStrength: ' + n(CONFIG.surfaces.default.normalStrength) + ',',
    '} },',
  ].join('\n');
  try {
    await navigator.clipboard.writeText(code);
    setStatus('config copied to clipboard');
  } catch {
    console.log(code);
    setStatus('clipboard blocked — config logged to console');
  }
};

addEventListener('keydown', (e) => {
  const u = asciiMaterial.uniforms;
  if (e.key === 'm') u.uMatrix.value = !u.uMatrix.value;
  if (e.key === 'n') u.uNoise.value  = !u.uNoise.value;
  if (e.key === '[') u.uSmear.value = Math.max(0, u.uSmear.value - 0.05);
  if (e.key === ']') u.uSmear.value = Math.min(1, u.uSmear.value + 0.05);
  if (e.key === 'r') playReveal();
  if (e.key === 'e') tween(u.uOutProgress, u.uOutProgress.value < 0.5 ? 1 : 0, CONFIG.exitDuration);
  drawHud();
});
drawHud();
setGrabCursor();
playReveal();   // on load

// Only one effect runs at a time; switching resets whatever the last one drove.
function applyScroll(p) {
  const u = asciiMaterial.uniforms;
  switch (CONFIG.scrollEffect) {
    case 'clip':  if (mixer) mixer.setTime(p * clipDuration); break;
    case 'smear': u.uSmear.value = p; break;
    case 'exit':  u.uOutProgress.value = p; break;
    // orbit and dolly move the camera, handled in the render loop
  }
}

function resetScrollEffects() {
  const u = asciiMaterial.uniforms;
  u.uSmear.value = 0;
  u.uOutProgress.value = 0;
  if (mixer) mixer.setTime(0);
  placeStaticCamera();
}

function placeStaticCamera(distanceScale = 1, angle = 0) {
  const elev = THREE.MathUtils.degToRad(CONFIG.cameraElevation);
  const d = CONFIG.cameraDistance * distanceScale;
  camera.position.set(Math.sin(angle) * Math.cos(elev) * d,
                      Math.sin(elev) * d,
                      Math.cos(angle) * Math.cos(elev) * d);
  camera.lookAt(0, 0, 0);
}

// Between keyframes this eases position and bias.
// Past the last one it orbits at fixed height and radius.
const _camPos = new THREE.Vector3();
const ease = (k) => k * k * (3.0 - 2.0 * k);

function placeCamera(progress) {
  const path = CONFIG.cameraPath;
  const last = path[path.length - 1];
  let bias;

  if (progress <= last.at) {
    let i = 0;
    while (i < path.length - 2 && progress > path[i + 1].at) i++;
    const a = path[i], b = path[i + 1];
    const k = ease(b.at === a.at ? 0 : (progress - a.at) / (b.at - a.at));
    _camPos.set(a.pos[0] + (b.pos[0] - a.pos[0]) * k,
                a.pos[1] + (b.pos[1] - a.pos[1]) * k,
                a.pos[2] + (b.pos[2] - a.pos[2]) * k);
    bias = a.pitchBias + (b.pitchBias - a.pitchBias) * k;
  } else {
    // Increasing phi runs +Z toward +X, which reads counterclockwise from above.
    const radius = Math.hypot(last.pos[0], last.pos[2]);
    const phi0   = Math.atan2(last.pos[0], last.pos[2]);
    const k      = ease(Math.min(1, (progress - last.at) / (1 - last.at)));
    const phi    = phi0 + THREE.MathUtils.degToRad(CONFIG.orbitSweep) * k;
    _camPos.set(radius * Math.sin(phi), last.pos[1], radius * Math.cos(phi));
    bias = last.pitchBias + (CONFIG.orbitEndPitchBias - last.pitchBias) * k;
  }

  camera.position.copy(_camPos);
  camera.lookAt(0, 0, 0);
  if (bias) camera.rotateX(-THREE.MathUtils.degToRad(bias));
}

let prevTime = 0;
renderer.setAnimationLoop((ms) => {
  const t = ms * 0.001;
  const dt = Math.min(0.05, t - prevTime);
  prevTime = t;

  const yaw = THREE.MathUtils.degToRad(CONFIG.subjectYaw) + dragYaw
            + (CONFIG.spin ? t * CONFIG.idleSpin : 0);
  subject.rotation.set(CONFIG.spin ? 0 : dragPitch, yaw, 0);
  subject.position.y = CONFIG.spin ? Math.sin(t * 0.6) * CONFIG.idleBob : 0;

  scrollValue += (scrollTarget - scrollValue) * CONFIG.scrollDamping;
  applyScroll(scrollValue);
  asciiMaterial.uniforms.uTime.value = t;

  if (cameraRig) {
    // The rig sits inside the subject, so its world matrices are only current
    // once the scrubbed pose has flushed down the graph.
    subject.updateMatrixWorld(true);
    camera.position.setFromMatrixPosition(cameraRig.follow.matrixWorld);
    camera.lookAt(_rigTarget.setFromMatrixPosition(cameraRig.lookAt.matrixWorld));
  } else if (CONFIG.useCameraPath) {
    placeCamera(scrollValue);
  } else if (CONFIG.scrollEffect === 'orbit') {
    placeStaticCamera(1, scrollValue * Math.PI * 2 * CONFIG.orbitTurns);
  } else if (CONFIG.scrollEffect === 'dolly') {
    placeStaticCamera(1 + scrollValue * (CONFIG.dollyRange - 1));
  }

  updateTweens(dt);
  updateTrail();
  renderer.setRenderTarget(trailTarget);
  renderer.clear();
  renderer.render(trailScene, quadCamera);

  renderer.setRenderTarget(target);
  renderer.clear();
  renderer.render(scene, camera);

  renderer.setRenderTarget(null);
  renderer.render(asciiScene, quadCamera);
});
</script>

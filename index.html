<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII post-process — minimal</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 1;
    font: 12px/1.6 ui-monospace, monospace; color: #666; white-space: pre;
    pointer-events: none; user-select: none;
  }
</style>

<div id="hud"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// CONFIG — the whole look lives here.
// Values in comments are what dragonfly.xyz uses for its hero scene.
// ---------------------------------------------------------------------------
const CONFIG = {
  characters: ' * _<>,  ./O#SF +',  // glyph ramp, darkest -> densest
  charLimit:  15,                   // how many of them the luminance ramp maps onto (site: 16)
  granularity: 4,                   // cell size in CSS px
  fontSize:   72,                   // px, drawn into a 64px atlas cell
  color:      '#eeeeee',            // glyph colour
  accentColor:'#ff8033',            // trail highlight (site theme-orange: 1.0, 0.5, 0.2)
  background: '#0a0a0a',
  brightnessFloor: 0.005,           // on-model cells never render darker than this (linear)

  // Model shading, one entry per surface. `match` is tested against the mesh's
  // own name and every ancestor's, so naming a group in Blender is enough to
  // shade its whole subtree. First match wins; `default` catches the rest.
  //
  // The site splits its hero the same way: the insect gets a flat grey remap
  // and hard light, the perch a cooler tint and much softer normals, picked
  // apart with getObjectByName('Branch002'). Note glTF node names are
  // sanitised on load — Blender's 'Branch.002' arrives as 'Branch002'.
  surfaces: {
    branch: {
      match:          /^branch/i,
      remapColor:     [0.69, 0.90, 0.90],   // site's exact perch values
      lightDir:       [0.0, 2.0, 1.0],
      brightness:     0.2,
      normalStrength: 0.5,
    },
    default: {
      remapColor:     [0.85, 0.85, 0.85],   // site: [0.35, 0.35, 0.35] — much sparser glyphs
      lightDir:       [0.0, 0.8, 1.0],
      brightness:     0.5,
      // Lowering this shifts weight off the raw normal and onto the smooth
      // lambert term, so low-poly facets read less sharply. 1.05 measured 2.22%
      // facet edges against 2.77% at the site's 1.5 — 20% fewer — and costs no
      // tonal range (luminance span stays 184 across 185 distinct levels).
      normalStrength: 1.05,
    },
  },

  noise: false,
  matrix: false,        // per-column vertical scroll
  matrixSpeed: 0.15,    // screens per second at max column noise
  smear: 0.0,           // 0..1 — how far up the waterfall collapse reaches
  outProgress: 0.0,     // 0..1 — columns lift off the top
  reveal: 1.0,          // threshold: 0 = fully visible, 1 = fully hidden

  revealDuration: 1.4,  // seconds
  exitDuration:   0.9,

  // The reveal transition also runs the exit lift backwards, so columns fall
  // into place while the normal wipe uncovers the surface. Set revealLift to 0
  // for a bare wipe. The lift settles first — ending on the wipe rather than on
  // sliding geometry keeps the last beat still.
  revealLift:         0.6,
  revealLiftDuration: 1.0,

  // Point this at a .glb or .gltf to replace the placeholder torus knot.
  // Draco-compressed files work as-is; the decoder is vendored in libs/draco/.
  // Any materials and textures in the file are discarded — the surface shader
  // below replaces them, so stripping the texture graph before shipping a model
  // saves the loader fetching PNGs it will throw away.
  //
  // The fox is a CC0 stand-in, only here so a fresh clone shows the loader
  // working. Swap in your own model and it will be framed the same way.
  model:     'models/dragonfly.glb',
  dracoPath: 'libs/draco/',
  // The site's hero runs a long lens — fov 11 at z 5 — which flattens
  // perspective so the subject reads evenly rather than falling away toward the
  // edges. It also shrinks the frustum to 2 * 5 * tan(5.5deg) = 0.96 units of
  // height, against 3.15 at fov 35, so fitRadius scales down with it.
  fov: 11,

  // Model is scaled so its bounding sphere matches this. There is no single
  // right value — it depends on how much of its bounding sphere the model
  // actually fills. Measure by projecting the box corners over a full spin
  // rather than guessing.
  fitRadius: 0.6,

  // The camera sits still and looks down on the subject — nothing orbits, so
  // the view stays fixed relative to the branch.
  cameraDistance:  5,
  cameraElevation: 30,      // degrees above the horizon

  // Static yaw on the model. Only applies when the model camera below is off —
  // with it on, the rig is inside the same group and rotates along with the
  // model, so the rendered shot is unchanged. Negative is clockwise from above.
  subjectYaw: -45,          // degrees

  // dragonfly.glb ships its own animated camera rig, which is how the site
  // frames its hero. When both nodes are present these drive the camera and
  // everything above is ignored; any other model falls back to the manual
  // placement. Note the rig scales with the model, so fitRadius stops mattering
  // for framing — camera and subject scale together and the image is identical.
  useModelCamera:   true,
  cameraFollowNode: 'camera-follow',
  cameraLookAtNode: 'camera-lookAt',

  // The clip is scrubbed by the wheel rather than running on a clock. Damping
  // eases the value toward wherever scrolling has left it.
  scrollSensitivity: 0.0006,   // progress per wheel pixel
  scrollDamping:     0.12,
};

const TRAIL_LENGTH = 40;

// ---------------------------------------------------------------------------
// 1. GLYPH ATLAS — generated at runtime, no image asset.
//    1024x1024 canvas, 16x16 grid of 64px cells, one character per cell.
// ---------------------------------------------------------------------------
function makeAtlas({ characters, fontSize }) {
  const SIZE = 1024, GRID = 16, CELL = SIZE / GRID;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;

  const ctx = canvas.getContext('2d');
  ctx.font = `${fontSize}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'white';

  characters.split('').forEach((char, i) => {
    const col = i % GRID, row = Math.floor(i / GRID);
    ctx.fillText(char, col * CELL + CELL / 2, row * CELL + CELL / 2);
  });

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = texture.magFilter = THREE.NearestFilter;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;  // charUV goes negative; repeat wraps it
  return texture;
}

// ---------------------------------------------------------------------------
// 2. SCENE PASS — mesh shaded from its normals only. No lights, no textures,
//    no materials on the model itself. Renders into an offscreen target.
// ---------------------------------------------------------------------------
// The three.js chunks are what make this work on rigged models: without the
// skinning includes a SkinnedMesh renders in bind pose and the animation is
// silently ignored. three enables USE_SKINNING per-object, so the same material
// serves both skinned and static meshes.
const sceneVert = /* glsl */`
  #include <common>
  #include <skinning_pars_vertex>

  varying vec3 vNormal;

  void main() {
    #include <beginnormal_vertex>
    #include <skinbase_vertex>
    #include <skinnormal_vertex>
    #include <defaultnormal_vertex>

    vNormal = normalize(transformedNormal);

    #include <begin_vertex>
    #include <skinning_vertex>
    #include <project_vertex>
  }
`;

const sceneFrag = /* glsl */`
  uniform vec3  uRemapColor;
  uniform vec3  uLightDir;
  uniform float uBrightness;
  uniform float uNormalStrength;
  uniform float uReveal;
  varying vec3  vNormal;

  void main() {
    // Wings and similar thin surfaces are single-sided, so their undersides are
    // backfaces. We draw those (side: DoubleSide) and flip the normal here —
    // without the flip an underside shades as though lit from behind and loses
    // its edge against the background.
    vec3 normal = normalize(vNormal);
    if (!gl_FrontFacing) normal = -normal;

    float diff  = max(dot(normal, normalize(uLightDir)), 0.0);

    vec3 color = (diff * uBrightness) + normal * uNormalStrength + 0.5;
    color = clamp(color, 0.15, 0.995);
    color *= uRemapColor;

    // --- normal-based reveal wipe ---
    // Y-facing surfaces appear first; a thin band rides the wipe front.
    float edge       = 0.05;
    float revealMask = dot(normal, vec3(0.0, 1.0, 0.0)) * 0.5 + 0.5;

    float visible  = step(uReveal, revealMask);
    float edgeBand = smoothstep(uReveal - edge, uReveal, revealMask)
                   - smoothstep(uReveal, uReveal + edge, revealMask);

    // At uReveal = 0 there is no wipe front, but the band still latches onto
    // fully down-facing normals. Fade it out over the last of the wipe.
    edgeBand *= smoothstep(0.0, edge, uReveal);

    // Not in the original: stops hidden fragments writing depth and punching
    // holes through geometry behind them. Visually identical either way.
    if (visible < 0.5) discard;

    // rgb only ever survives as luminance, so the band is smuggled out through
    // alpha for the ASCII pass to tint. Alpha now means: 0 = nothing drawn here,
    // 0.5 = plain surface, 1.0 = full edge band.
    color = mix(color, vec3(0.5, 0.8, 0.2), edgeBand);

    gl_FragColor = vec4(color, 0.5 + 0.5 * clamp(edgeBand, 0.0, 1.0));
  }
`;

// ---------------------------------------------------------------------------
// 3. MOUSE TRAIL PASS — quarter-res target. Not a ping-pong FBO: it redraws
//    40 circles every frame from a chain of points that lerp toward each other.
// ---------------------------------------------------------------------------
const quadVert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const trailFrag = /* glsl */`
  #define TRAIL_LENGTH ${TRAIL_LENGTH}
  #define PIXEL_SIZE 80.0

  uniform vec2  uTrail[TRAIL_LENGTH];
  uniform float uTrailStrength[TRAIL_LENGTH];
  uniform float uVelocity;

  varying vec2 vUv;

  vec2 pixelate(vec2 uv, float pixels) {
    return floor(uv * pixels) / pixels;
  }

  float circle(vec2 uv, vec2 center, float radius) {
    return 1.0 - smoothstep(radius - 0.02, radius + 0.02, length(uv - center));
  }

  void main() {
    vec2 uv = pixelate(vUv, PIXEL_SIZE);
    float trail = 0.0;

    for (int i = 0; i < TRAIL_LENGTH; i++) {
      float fade     = 1.0 - float(i) / float(TRAIL_LENGTH);
      float size     = uVelocity * 0.025 * fade;
      float strength = uTrailStrength[i] * fade;
      trail += circle(uv, uTrail[i], size) * strength;
    }

    trail = clamp(trail, 0.0, 1.0);
    gl_FragColor = vec4(vec3(trail), trail * uVelocity);
  }
`;

// ---------------------------------------------------------------------------
// 4. ASCII PASS — fullscreen quad. Pixelate to a grid, read the cell's
//    luminance, pick a glyph, sample the atlas.
// ---------------------------------------------------------------------------
const asciiFrag = /* glsl */`
  precision highp float;

  uniform sampler2D tDiffuse;
  uniform sampler2D tMouseTrail;
  uniform sampler2D uCharactersTexture;
  uniform vec2  uResolution;
  uniform float uGranularity;
  uniform float uCharactersLimit;
  uniform vec3  uColor;
  uniform vec3  uAccentColor;
  uniform vec3  uBackground;
  uniform float uBrightnessFloor;
  uniform float uTime;
  uniform float uSmear;
  uniform float uMatrixSpeed;
  uniform float uOutProgress;
  uniform bool  uNoise;
  uniform bool  uMatrix;

  varying vec2 vUv;

  const float GRID = 16.0;  // atlas is 16x16 cells

  // Average the cell footprint rather than point-sampling its centre. With one
  // tap a cell flips glyph the instant that single texel crosses a ramp
  // boundary, so slow motion makes cells pop individually.
  //
  // The /3.0 spread is measured, not arbitrary — it beat both /4.0 and /2.0 at
  // every rotation step. /4.0 samples so close to the centre it inherits the
  // point-sample pops; /2.0 puts the outer taps on the cell boundary, so
  // neighbouring cells share them and respond in unison.
  vec4 cellAverage(vec2 uv, vec2 cell) {
    vec4 sum = vec4(0.0);
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        sum += texture2D(tDiffuse, uv + vec2(float(i), float(j)) * cell / 3.0);
      }
    }
    return sum / 9.0;
  }

  // Read one glyph out of the atlas. screenUV picks where inside the cell to
  // look; index picks which of the 16x16 atlas cells to read from.
  float glyph(float index, vec2 screenUV, vec2 division) {
    float charX = mod(index, GRID);
    float charY = floor(index / GRID);

    vec2 charUV = mod(screenUV * (division / GRID), 1.0 / GRID);
    charUV.y -= 1.0 / GRID;                     // canvas rows run top-down, UV runs bottom-up
    charUV   += vec2(charX, -charY) / GRID;

    return texture2D(uCharactersTexture, charUV).r;
  }

  float grayscale(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
  float noise2D(vec2 p)   { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  float random(float x)   { return fract(sin(x) * 123456.789); }
  float hash(float n)     { return fract(sin(n) * 43758.5453); }

  void main() {
    vec2 screenUV = vUv;

    // --- pixelation grid ---
    vec2 division    = uResolution / uGranularity;
    vec2 d           = 1.0 / division;
    vec2 pixelizedUV = d * (floor(screenUV / d) + 0.5);

    vec4 mouseTrail = texture2D(tMouseTrail, screenUV);

    // --- matrix column motion ---
    // Each column scrolls at its own rate. The glyph grid below is sampled at
    // screenUV, so the cells stay put and only their content streams.
    if (uMatrix) {
      float noise = random(pixelizedUV.x);
      pixelizedUV.y += uTime * uMatrixSpeed * abs(noise);
      pixelizedUV.y  = fract(pixelizedUV.y);
    }

    // --- exit lift ---
    // Computed here (before smear touches .x) but applied after it. Each column
    // leaves at its own rate, so the frame empties raggedly rather than as a band.
    float columnNoise = random(floor(pixelizedUV.x * division.x));
    float exitLift    = uOutProgress * (1.2 + columnNoise);

    // --- smear / waterfall ---
    // Rows below the smear front collapse onto the bottom row and fade out.
    float waterfallAlpha = 1.0;

    if (uSmear > 0.0) {
      float rowHeight = d.y;
      float py        = clamp(pixelizedUV.y, 0.0, 1.0);

      float rowIndex  = floor(py / rowHeight);
      float totalRows = division.y;

      float rowNoise     = hash(rowIndex * 17.0);
      float edgeNoise    = hash(rowIndex * 21.0);
      float stretchNoise = hash(rowIndex * 9.0 + 0.3);

      float smearRows      = uSmear * totalRows;
      float noiseAmount    = 0.35 * uSmear;
      float noisySmearRows = smearRows + (rowNoise - 0.5) * noiseAmount * totalRows;

      float blendRows = max(1.0, smearRows * 0.835);
      float dist      = noisySmearRows - rowIndex;
      float smearMask = clamp(dist / blendRows, 0.0, 1.0);
      smearMask = pow(smearMask, mix(1.5, 3.0, edgeNoise));

      float lastRowY   = rowHeight * 0.5;
      float flowNoise  = hash(rowIndex * 31.0 + pixelizedUV.x * 13.0);
      py -= flowNoise * rowHeight * smearMask * 0.6;
      py  = mix(py, lastRowY, smearMask);

      float depth   = 1.0 - (rowIndex / totalRows);
      float stretch = 0.1 * uSmear;
      stretch *= stretch;
      stretch *= mix(0.6, 1.4, stretchNoise);

      pixelizedUV.x = 0.5 + (pixelizedUV.x - 0.5) * (1.0 + stretch * smearMask);
      pixelizedUV.y = py;

      waterfallAlpha = mix(1.0, 0.05, depth * smearMask * uSmear);
    }

    // --- apply exit ---
    pixelizedUV.y -= exitLift;

    if (pixelizedUV.y < 0.0) {
      gl_FragColor = vec4(uBackground, 1.0);
      return;
    }

    vec4 pixelizedColor = cellAverage(pixelizedUV, d);

    // alpha carries two things (see the scene shader): anything above 0.25 is
    // surface, and whatever sits above 0.5 is the reveal wipe's edge band.
    float visible = step(0.25, pixelizedColor.a);
    float band    = clamp((pixelizedColor.a - 0.5) * 2.0, 0.0, 1.0) * visible;
    float gray    = grayscale(pixelizedColor.rgb) * visible;

    // --- edge detection, used to gate the trail ---
    vec2 texel = 1.0 / uResolution;
    float left  = grayscale(cellAverage(pixelizedUV + vec2(-texel.x, 0.0), d).rgb);
    float right = grayscale(cellAverage(pixelizedUV + vec2( texel.x, 0.0), d).rgb);
    float up    = grayscale(cellAverage(pixelizedUV + vec2(0.0,  texel.y), d).rgb);
    float down  = grayscale(cellAverage(pixelizedUV + vec2(0.0, -texel.y), d).rgb);
    float edgeMask = smoothstep(0.01, 0.25, length(vec2(right - left, up - down)));

    // --- glyph selection ---
    // The trail overrides the glyph index, but only on edges — otherwise it
    // punches flat holes through the middle of the shape.
    float baseF  = gray * (uCharactersLimit - 1.0);
    float trailF = mouseTrail.r * (uCharactersLimit - 1.0);
    float trailInfluence = step(0.1, mouseTrail.r) * edgeMask;
    float f = mix(baseF, trailF, trailInfluence);

    // Cross-fade the pair the ramp position falls between, so a cell dissolves
    // from one character into the next instead of snapping. i1 is clamped so the
    // brightest cells cannot bleed into the blank slot past the ramp's end.
    float i0 = floor(f);
    float i1 = min(i0 + 1.0, uCharactersLimit - 1.0);

    float ascii = mix(glyph(i0, screenUV, division), glyph(i1, screenUV, division), fract(f));

    // --- grain ---
    if (uNoise) {
      float n = noise2D(pixelizedUV * 120.0 + uTime * 0.033);
      ascii *= mix(0.6, 1.4, smoothstep(0.5, 0.9, n));
    }

    ascii *= waterfallAlpha;

    vec3 color = mix(uBackground, uColor * ascii, clamp(ascii, 0.0, 1.0));

    // --- accent: trailed edges, plus the reveal wipe front ---
    float accent = clamp(max(mouseTrail.r * edgeMask, band), 0.0, 1.0) * ascii;
    color = mix(color, uAccentColor, accent);

    // Keep the model's darkest cells off pure black. Only where the model is,
    // so the surrounding void stays exactly uBackground.
    color = max(color, vec3(uBrightnessFloor) * visible);

    gl_FragColor = vec4(color, 1.0);
  }
`;

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);   // empty pixels stay alpha 0 -> darkest glyph
document.body.appendChild(renderer.domElement);

const target      = new THREE.WebGLRenderTarget(1, 1);
const trailTarget = new THREE.WebGLRenderTarget(1, 1);

const fullscreenQuad = (material) => {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
  return s;
};
const quadCamera = new THREE.Camera();

// -- pass 1: scene
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.fov, 1, 0.1, 100);
{
  const elev = THREE.MathUtils.degToRad(CONFIG.cameraElevation);
  camera.position.set(0,
                      Math.sin(elev) * CONFIG.cameraDistance,
                      Math.cos(elev) * CONFIG.cameraDistance);
  camera.lookAt(0, 0, 0);
}

// One material per CONFIG.surfaces entry. uReveal is a single uniform object
// shared by all of them, so the wipe stays in lockstep off one tween instead of
// needing to be broadcast — the per-surface uniforms are the only ones that differ.
const revealUniform = { value: CONFIG.reveal };

const materials = Object.fromEntries(
  Object.entries(CONFIG.surfaces).map(([name, spec]) => [name, new THREE.ShaderMaterial({
    vertexShader: sceneVert,
    fragmentShader: sceneFrag,
    uniforms: {
      uRemapColor:     { value: new THREE.Vector3(...spec.remapColor) },
      uLightDir:       { value: new THREE.Vector3(...spec.lightDir) },
      uBrightness:     { value: spec.brightness },
      uNormalStrength: { value: spec.normalStrength },
      uReveal:         revealUniform,
    },
    // Thin geometry has no back — cull it and the undersides vanish. On this
    // model that was hiding 45-100% of the drawn pixels depending on the angle.
    side: THREE.DoubleSide,
  })])
);

// Walk up the ancestry so a match on a group covers every mesh beneath it —
// glTF meshes usually carry exporter-generated names, their parents don't.
function surfaceFor(object) {
  for (const [name, spec] of Object.entries(CONFIG.surfaces)) {
    if (!spec.match) continue;
    for (let node = object; node; node = node.parent) {
      if (spec.match.test(node.name)) return materials[name];
    }
  }
  return materials.default;
}

const subject = new THREE.Group();
subject.rotation.y = THREE.MathUtils.degToRad(CONFIG.subjectYaw);
scene.add(subject);
let mixer = null, clipDuration = 0, cameraRig = null;
const _rigTarget = new THREE.Vector3();

// Centre on the origin and scale to a predictable size, so any .glb frames the
// same way regardless of the units it was authored in.
function fitToView(object) {
  const box    = new THREE.Box3().setFromObject(object);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  if (!sphere.radius) return;
  const scale = CONFIG.fitRadius / sphere.radius;
  object.scale.multiplyScalar(scale);
  object.position.sub(sphere.center.multiplyScalar(scale));
}

async function loadModel(url) {
  const [{ GLTFLoader }, { DRACOLoader }, { mergeVertices }] = await Promise.all([
    import('three/addons/loaders/GLTFLoader.js'),
    import('three/addons/loaders/DRACOLoader.js'),
    import('three/addons/utils/BufferGeometryUtils.js'),
  ]);

  const draco = new DRACOLoader().setDecoderPath(CONFIG.dracoPath);
  const loader = new GLTFLoader().setDRACOLoader(draco);

  try {
    const gltf = await loader.loadAsync(url);

    gltf.scene.traverse((o) => {
      if (!o.isMesh) return;
      // Drop whatever material the file shipped with.
      o.material = surfaceFor(o);
      // Everything here is shaded from normals, and plenty of glTF files ship
      // without them (Fox.glb carries only POSITION/TEXCOORD/JOINTS/WEIGHTS).
      // Without this the shader normalises a zero vector and the model renders
      // as flat white. Bind-pose normals are correct — the vertex shader skins
      // them afterwards.
      if (!o.geometry.attributes.normal) {
        // On non-indexed geometry computeVertexNormals gives every triangle its
        // own normal, which reads as faceted. Weld coincident vertices first so
        // each normal is the average of the faces meeting there and the shading
        // runs smoothly across face boundaries. UVs are unused here and their
        // seams would block welding, so drop them before merging.
        if (!o.geometry.index) {
          if (o.geometry.attributes.uv) o.geometry.deleteAttribute('uv');
          o.geometry = mergeVertices(o.geometry);
        }
        o.geometry.computeVertexNormals();
      }
    });

    const holder = new THREE.Group();
    holder.add(gltf.scene);
    fitToView(holder);
    subject.add(holder);

    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      mixer.clipAction(gltf.animations[0]).play();
      clipDuration = gltf.animations[0].duration;
    }

    if (CONFIG.useModelCamera) {
      const follow = gltf.scene.getObjectByName(CONFIG.cameraFollowNode);
      const lookAt = gltf.scene.getObjectByName(CONFIG.cameraLookAtNode);
      if (follow && lookAt) cameraRig = { follow, lookAt };
    }
    return gltf;
  } finally {
    draco.dispose();   // frees the decoder worker either way
  }
}

function addPlaceholder() {
  subject.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.36, 220, 32), materials.default));
}

if (CONFIG.model) {
  try {
    await loadModel(CONFIG.model);
  } catch (err) {
    console.error(`could not load ${CONFIG.model}, falling back to the placeholder:`, err);
    addPlaceholder();
  }
} else {
  addPlaceholder();
}

// -- pass 2: trail
const trailPoints   = Array.from({ length: TRAIL_LENGTH }, () => new THREE.Vector2(0.5, 0.5));
const trailStrength = new Array(TRAIL_LENGTH).fill(0);

const trailMaterial = new THREE.ShaderMaterial({
  vertexShader: quadVert,
  fragmentShader: trailFrag,
  blending: THREE.NoBlending,
  uniforms: {
    uTrail:         { value: trailPoints },
    uTrailStrength: { value: trailStrength },
    uVelocity:      { value: 0 },
  },
});
const trailScene = fullscreenQuad(trailMaterial);

const mouseUV = new THREE.Vector2(0.5, 0.5);
let lastMouseUV = new THREE.Vector2(0.5, 0.5);
let velocity = 0;

addEventListener('pointermove', (e) => {
  mouseUV.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
  velocity = Math.min(1, velocity + mouseUV.distanceTo(lastMouseUV) * 12);
  lastMouseUV.copy(mouseUV);
});

function updateTrail() {
  velocity *= 0.94;
  // chain: every point eases toward the one in front of it
  for (let i = TRAIL_LENGTH - 1; i > 0; i--) {
    trailPoints[i].lerp(trailPoints[i - 1], 0.499);
    trailStrength[i] = THREE.MathUtils.lerp(trailStrength[i], trailStrength[i - 1] * 0.99, 0.499);
  }
  trailPoints[0].copy(mouseUV);
  trailStrength[0] = Math.min(velocity * TRAIL_LENGTH, 1);
  trailMaterial.uniforms.uVelocity.value = velocity;
}

// -- pass 3: ascii
const asciiMaterial = new THREE.ShaderMaterial({
  vertexShader: quadVert,
  fragmentShader: asciiFrag,
  uniforms: {
    tDiffuse:           { value: target.texture },
    tMouseTrail:        { value: trailTarget.texture },
    uCharactersTexture: { value: makeAtlas(CONFIG) },
    uResolution:        { value: new THREE.Vector2() },
    uGranularity:       { value: CONFIG.granularity },
    uCharactersLimit:   { value: CONFIG.charLimit },
    uColor:             { value: new THREE.Color(CONFIG.color) },
    uAccentColor:       { value: new THREE.Color(CONFIG.accentColor) },
    uBackground:        { value: new THREE.Color(CONFIG.background) },
    uBrightnessFloor:   { value: CONFIG.brightnessFloor },
    uTime:              { value: 0 },
    uSmear:             { value: CONFIG.smear },
    uMatrixSpeed:       { value: CONFIG.matrixSpeed },
    uOutProgress:       { value: CONFIG.outProgress },
    uNoise:             { value: CONFIG.noise },
    uMatrix:            { value: CONFIG.matrix },
  },
});
const asciiScene = fullscreenQuad(asciiMaterial);

function resize() {
  const w = innerWidth, h = innerHeight, dpr = renderer.getPixelRatio();
  renderer.setSize(w, h);
  target.setSize(Math.round(w * dpr), Math.round(h * dpr));
  trailTarget.setSize(Math.ceil(w * dpr / 4), Math.ceil(h * dpr / 4));   // trail runs at quarter res
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  asciiMaterial.uniforms.uResolution.value.set(w, h);
}
addEventListener('resize', resize);
resize();

// -- transitions
const tweens = [];
function tween(uniform, to, duration) {
  const running = tweens.findIndex((w) => w.uniform === uniform);
  if (running >= 0) tweens.splice(running, 1);
  tweens.push({ uniform, from: uniform.value, to, duration, elapsed: 0 });
}
function updateTweens(dt) {
  if (!tweens.length) return;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i];
    w.elapsed += dt;
    const k = Math.min(1, w.elapsed / w.duration);
    const ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    w.uniform.value = w.from + (w.to - w.from) * ease;
    if (k >= 1) tweens.splice(i, 1);
  }
  drawHud();
}

// -- scroll drives the clip
let scrollTarget = 0, scrollValue = 0;
addEventListener('wheel', (e) => {
  scrollTarget = Math.min(1, Math.max(0, scrollTarget + e.deltaY * CONFIG.scrollSensitivity));
  drawHud();
}, { passive: true });

// -- controls
const hud = document.getElementById('hud');
const drawHud = () => {
  const u = asciiMaterial.uniforms;
  hud.textContent =
    `[m] matrix ${u.uMatrix.value ? 'on ' : 'off'}   [n] grain ${u.uNoise.value ? 'on ' : 'off'}   `
    + `[ / ] smear ${u.uSmear.value.toFixed(2)}\n`
    + `[r] reveal ${revealUniform.value.toFixed(2)}   [e] exit ${u.uOutProgress.value.toFixed(2)}   `
    + `scroll ${(scrollValue * 100).toFixed(0)}%   move the mouse for the trail`;
};
// The entrance: the scene pass uncovers the surface by normal while the ASCII
// pass drops the columns back down. Two passes, one gesture.
function playReveal() {
  revealUniform.value = 1;
  tween(revealUniform, 0, CONFIG.revealDuration);

  if (CONFIG.revealLift > 0) {
    const lift = asciiMaterial.uniforms.uOutProgress;
    lift.value = CONFIG.revealLift;
    tween(lift, 0, CONFIG.revealLiftDuration);
  }
}

addEventListener('keydown', (e) => {
  const u = asciiMaterial.uniforms;
  if (e.key === 'm') u.uMatrix.value = !u.uMatrix.value;
  if (e.key === 'n') u.uNoise.value  = !u.uNoise.value;
  if (e.key === '[') u.uSmear.value = Math.max(0, u.uSmear.value - 0.05);
  if (e.key === ']') u.uSmear.value = Math.min(1, u.uSmear.value + 0.05);
  if (e.key === 'r') playReveal();
  if (e.key === 'e') tween(u.uOutProgress, u.uOutProgress.value < 0.5 ? 1 : 0, CONFIG.exitDuration);
  drawHud();
});
drawHud();
playReveal();   // on load

let prevTime = 0;
renderer.setAnimationLoop((ms) => {
  const t = ms * 0.001;
  const dt = Math.min(0.05, t - prevTime);
  prevTime = t;

  scrollValue += (scrollTarget - scrollValue) * CONFIG.scrollDamping;
  if (mixer) mixer.setTime(scrollValue * clipDuration);
  asciiMaterial.uniforms.uTime.value = t;

  // The rig lives inside the subject, so its world matrices are only current
  // once the scrubbed pose has been flushed down the graph.
  if (cameraRig) {
    subject.updateMatrixWorld(true);
    camera.position.setFromMatrixPosition(cameraRig.follow.matrixWorld);
    camera.lookAt(_rigTarget.setFromMatrixPosition(cameraRig.lookAt.matrixWorld));
  }

  updateTweens(dt);
  updateTrail();
  renderer.setRenderTarget(trailTarget);
  renderer.clear();
  renderer.render(trailScene, quadCamera);

  renderer.setRenderTarget(target);
  renderer.clear();
  renderer.render(scene, camera);

  renderer.setRenderTarget(null);
  renderer.render(asciiScene, quadCamera);
});
</script>
